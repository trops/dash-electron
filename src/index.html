<!DOCTYPE html>
<html lang="en">
    <head>
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https: http://localhost:3000 ws://localhost:3000"
        />
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Dash" />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <!-- Aurora fonts (slice 1): Hanken Grotesk (body) + JetBrains Mono
             (data/micro-labels), served from jsDelivr, which is already
             allowlisted in the CSP above (style-src + font-src). -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hanken-grotesk@5/index.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5/index.css"
        />
        <link
            rel="preload"
            href="%PUBLIC_URL%/tailwind.css"
            as="style"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript
            ><link rel="stylesheet" href="%PUBLIC_URL%/tailwind.css"
        /></noscript>
        <title>Dash</title>
        <script>
            window.global = window;
            // Opt the app into the Aurora design treatment (gated .dr-* styles
            // in dash-react's designSystem.css). Remove this line to revert.
            document.documentElement.setAttribute("data-design", "aurora");
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <style>
            body {
                margin: 0;
            }
            #root-loader {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                background: #171717;
                color: #a3a3a3;
                font-family: system-ui;
                font-size: 14px;
            }
        </style>
        <div id="root-loader"></div>
        <div id="root"></div>
        <script>
            const observer = new MutationObserver(() => {
                const root = document.getElementById("root");
                if (root && root.children.length > 0) {
                    document.getElementById("root-loader")?.remove();
                    observer.disconnect();
                }
            });
            observer.observe(document.getElementById("root"), {
                childList: true,
            });
        </script>
        <script>
            // Early-boot error logger. It only logs: it never touches the
            // page. It used to append an error <div> with
            // document.body.innerHTML +=, which rebuilt the whole page from
            // text — React's elements and every click handler were lost,
            // and a widget's broken image was re-created and failed again,
            // in an endless loop (a Home Assistant album cover,
            // 2026-10-31). Errors inside widgets are caught by dash-core's
            // WidgetErrorBoundary; DevTools has the rest.
            //
            // Not logged here:
            // 1. A file that failed to load (an <img>, <script>, <link>):
            //    the error event's target is that element, not the window.
            //    A widget's broken image is the widget's own business.
            // 2. While the AI Widget Builder is open
            //    (window.__DASH_WIDGET_BUILDER_OPEN): its scoped handler
            //    and PreviewErrorBoundary show the recovery UI.
            // 3. A throw from inside an AI widget bundle (its stack has
            //    `evaluateBundle`): WidgetErrorBoundary renders the inline
            //    error card; logging it again makes it look like the app
            //    crashed.
            function isWidgetBundleError(e) {
                var stack =
                    (e && e.error && e.error.stack) ||
                    (e && e.reason && e.reason.stack) ||
                    "";
                return (
                    typeof stack === "string" &&
                    stack.indexOf("evaluateBundle") >= 0
                );
            }
            function isLoadFailure(e) {
                return !!(e && e.target && e.target !== window);
            }
            window.addEventListener(
                "error",
                function (e) {
                    if (isLoadFailure(e)) return;
                    if (window.__DASH_WIDGET_BUILDER_OPEN) return;
                    if (isWidgetBundleError(e)) return;
                    console.error("Global error:", e.error || e.message);
                },
                true
            );
            window.addEventListener(
                "unhandledrejection",
                function (e) {
                    if (window.__DASH_WIDGET_BUILDER_OPEN) return;
                    if (isWidgetBundleError(e)) return;
                    console.error(
                        "Unhandled rejection:",
                        e.reason || e.message
                    );
                },
                true
            );
        </script>
    </body>
</html>
